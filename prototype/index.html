const closeModal=()=>document.getElementById('modalBackdrop').classList.remove('open');
const formField=(id,label,value,type='text')=>`<div class="field"><label for="${id}">${label}</label><input id="${id}" ${type==='date'?'type="date"':'type="text"'} value="${esc(value)}" required/></div>`;
const editTask=id=>{const t=state.tasks.find(t=>t.id===id);if(!t)return;openModal(`<div class="modal-head"><div><div class="eyebrow">Task update · ${t.id}</div><h2 id="modalTitle">${esc(t.title)}</h2><div class="sub">${esc(proj(t.project)?.name||'')}</div></div><button class="close" data-action="close">×</button></div><form id="taskForm" data-id="${t.id}"><div class="modal-grid"><div class="field"><label for="editStatus">Status</label><select id="editStatus">${['To Do','In Progress','Blocked','Done'].map(s=>`<option ${s===t.status?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label for="editPriority">Priority</label><select id="editPriority">${['Low','Medium','High','Critical'].map(s=>`<option ${s===t.priority?'selected':''}>${s}</option>`).join('')}</select></div></div><div class="modal-grid"><div class="field"><label for="editAssignee">PIC Utama</label><select id="editAssignee">${['BA 01','BA 02','BA 03'].map(s=>`<option ${s===t.assignee?'selected':''}>${s}</option>`).join('')}</select></div>${formField('editDue','Due date',t.due,'date')}</div><div class="field"><label for="editDetail">Catatan / Next Action</label><textarea id="editDetail">${esc(t.detail)}</textarea></div><div class="buttonrow" style="justify-content:flex-end;margin-top:23px"><button type="button" class="btn" data-action="close">Batal</button><button type="submit" class="btn primary">Simpan Update</button></div></form>`)};
const addTask=()=>openModal(`<div class="modal-head"><div><div class="eyebrow">Task management</div><h2 id="modalTitle">Tambah Task Baru</h2><div class="sub">Task baru akan muncul pada project dan workspace BA.</div></div><button class="close" data-action="close">×</button></div><form id="newTaskForm">${formField('newTitle','Task name','','text')}<div class="modal-grid"><div class="field"><label>Project</label><select id="newProject">${state.projects.map(p=>`<option value="${p.id}" ${p.id===state.selectedProject?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div><div class="field"><label>PIC Utama</label><select id="newAssignee">${['BA 01','BA 02','BA 03'].map(s=>`<option ${s===state.selectedBA?'selected':''}>${s}</option>`).join('')}</select></div></div><div class="modal-grid">${formField('newDue','Due Date','2026-10-20','date')}<div class="field"><label>Milestone</label><select id="newMilestone">${milestoneTemplate.map(m=>`<option>${m.title}</option>`).join('')}</select></div></div><div class="field"><label>Detail Task</label><textarea id="newDetail" placeholder="Acceptance criteria / activity... "></textarea></div><div class="buttonrow" style="justify-content:flex-end"><button type="button" class="btn" data-action="close">Batal</button><button type="submit" class="btn primary">Buat Task</button></div></form>`);
const addIssue=()=>openModal(`<div class="modal-head"><div><div class="eyebrow">Issue & escalation</div><h2 id="modalTitle">Laporkan Kendala</h2></div><button class="close" data-action="close">×</button></div><form id="issueForm">${formField('issueTitle','Issue title','')}<div class="modal-grid"><div class="field"><label>Severity</label><select id="issueSeverity"><option>Medium</option><option>High</option><option>Critical</option></select></div>${formField('issueDue','Target Resolution','2026-10-14','date')}</div><div class="field"><label>Dampak terhadap project</label><textarea id="issueImpact" required></textarea></div><div class="field"><label>Action plan</label><textarea id="issueAction" required></textarea></div><div class="buttonrow" style="justify-content:flex-end"><button type="button" class="btn" data-action="close">Batal</button><button type="submit" class="btn primary">Simpan Issue</button></div></form>`);
const downloadCSV=()=>{const rows=[['Project ID','Project','Department','PM','Progress','Health','Baseline','Forecast'],...state.projects.map(p=>[p.id,p.name,p.department,p.pm,p.progress,p.health,p.due,p.forecast])];const csv='\uFEFF'+rows.map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');const a=document.createElement('a');const u=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.href=u;a.download='projectpulse_portfolio_demo.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);toast('CSV portfolio berhasil dibuat.');};
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;switch(a){case 'dept':state.selectedDept=b.dataset.dept;state.page='department';state.returnPage='department';state.search='';document.getElementById('search').value='';render();break;case 'nav':if(b.dataset.page!=='project')state.returnPage=b.dataset.page;state.page=b.dataset.page;state.search='';document.getElementById('search').value='';render();break;case 'project':state.returnPage=state.page==='project'?state.returnPage:state.page;state.selectedProject=b.dataset.id;state.page='project';state.projectTab='overview';render();break;case 'back':state.page=state.returnPage;render();break;case 'tab':state.projectTab=b.dataset.tab;render();break;case 'task':editTask(b.dataset.id);break;case 'addTask':addTask();break;case 'addIssue':addIssue();break;case 'close':closeModal();break;case 'export':downloadCSV();break;case 'resolveIssue':{const i=state.issues.find(i=>i.id===b.dataset.id);if(i){i.status='Resolved';state.activities.unshift({person:'PM 01',message:`menyelesaikan issue ${i.title}`,date:'10 Okt · demo'});persist();render();toast('Issue ditandai resolved (demo).')}}break;}});
document.addEventListener('submit',e=>{e.preventDefault();const id=e.target.id;if(id==='taskForm'){const t=state.tasks.find(t=>t.id===e.target.dataset.id);if(!t)return;t.status=document.getElementById('editStatus').value;t.priority=document.getElementById('editPriority').value;t.assignee=document.getElementById('editAssignee').value;t.due=document.getElementById('editDue').value;t.detail=document.getElementById('editDetail').value;state.activities.unshift({person:t.assignee,message:`memperbarui task ${t.title} menjadi ${t.status}`,date:'10 Okt · demo'});toast('Task berhasil diperbarui.')}else if(id==='newTaskForm'){const title=document.getElementById('newTitle').value.trim();if(!title)return;const idnum=Date.now().toString().slice(-6);state.tasks.push({id:'TSK-'+idnum,project:document.getElementById('newProject').value,title,assignee:document.getElementById('newAssignee').value,contributor:'',milestone:document.getElementById('newMilestone').value,priority:'Medium',due:document.getElementById('newDue').value,status:'To Do',detail:document.getElementById('newDetail').value});state.activities.unshift({person:'BA 01',message:`membuat task ${title}`,date:'10 Okt · demo'});toast('Task baru ditambahkan.')}else if(id==='issueForm'){const title=document.getElementById('issueTitle').value.trim();if(!title)return;state.issues.push({id:'ISS-'+Date.now().toString().slice(-6),project:state.selectedProject,title,severity:document.getElementById('issueSeverity').value,status:'Open',owner:'BA 01',due:document.getElementById('issueDue').value,action:document.getElementById('issueAction').value,impact:document.getElementById('issueImpact').value});state.activities.unshift({person:'BA 01',message:`melaporkan issue ${title}`,date:'10 Okt · demo'});toast('Issue baru ditambahkan.')}persist();closeModal();render();});
document.addEventListener('change',e=>{if(e.target.id==='role'){state.page=e.target.value;state.returnPage=e.target.value;state.search='';document.getElementById('search').value='';render()}else if(e.target.id==='deptSelect'){state.selectedDept=e.target.value;render()}else if(e.target.id==='pmSelect'){state.selectedPM=e.target.value;render()}else if(e.target.id==='baSelect'){state.selectedBA=e.target.value;render()}});
document.getElementById('search').addEventListener('input',e=>{state.search=e.target.value.trim();render()});
document.getElementById('modalBackdrop').addEventListener('click',e=>{if(e.target.id==='modalBackdrop')closeModal()});
document.getElementById('resetDemo').addEventListener('click',()=>{state.projects=clone(seedProjects);state.tasks=clone(seedTasks);state.issues=clone(seedIssues);state.activities=[];persist();render();toast('Data simulasi dikembalikan ke awal.')});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
render();
})();
</script>
</body>
</html>
